name: Validate plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax check
        run: php -l ghbackup/plugin.php
      - name: Static integrity check
        run: |
          test "$(grep -c 'class pluginGhbackup' ghbackup/plugin.php)" -eq 1
          test "$(grep -c 'private function isConfigured' ghbackup/plugin.php)" -eq 1
          test "$(grep -c 'private function buildActionsWorkflow' ghbackup/plugin.php)" -eq 1
